<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calwortime</title>
<link rel="stylesheet" href="./css/styles.css">
<script src="./js/chart.js" defer></script>
<script src="./js/html2pdf.js" defer></script>
<script src="./js/native-bridge.js" defer></script>
<script src="./js/app.js" defer></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-12"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
<symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<header>
  <button class="hb" id="btn-menu" aria-label="Respaldos"><svg class="ic"><use href="#i-menu"/></svg></button>
  <h1>Calwortime</h1>
  <button class="hb" id="btn-perfil" aria-label="Perfil"><svg class="ic"><use href="#i-user"/></svg></button>
</header>

<main id="main">

  <section id="v-inicio" class="screen active">
    <div class="hero-wrap"><div class="hero">
      <small id="fecha"></small>
      <p id="tot-h">0.00 hrs acumuladas</p>
      <h2 id="tot-m">Q 0.00</h2>
      <div class="qa">
        <button class="btn" data-go="registro"><svg class="ic"><use href="#i-plus"/></svg>Nuevo turno</button>
        <button class="btn ghost" data-go="informes"><svg class="ic"><use href="#i-chart"/></svg>Reportes</button>
      </div>
    </div></div>
    <div class="sheet">
      <h3>Historial de jornadas</h3>
      <small class="muted">Desliza un turno a la izquierda para editar o eliminar</small>
      <div id="lista"></div>
    </div>
  </section>

  <section id="v-registro" class="screen">
    <div class="sheet">
      <h3 id="form-titulo">Registrar jornada</h3>
      <button type="button" class="btn ghost full" id="btn-ahora"><svg class="ic"><use href="#i-bolt"/></svg>Rellenar con hora actual</button>
      <form id="f-jor" autocomplete="off">
        <label>Fecha de entrada<div class="fi"><input type="text" id="j-fecha" placeholder="AAAA-MM-DD" readonly required><svg class="ic"><use href="#i-cal"/></svg></div></label>
        <label>Hora de entrada<div class="fi"><input type="text" id="j-ini" placeholder="00:00" readonly required><svg class="ic"><use href="#i-clock"/></svg></div></label>
        <label>Hora de salida<div class="fi"><input type="text" id="j-fin" placeholder="00:00" readonly required><svg class="ic"><use href="#i-clock"/></svg></div></label>
        <label>Pausa no remunerada (minutos)<input type="number" id="j-pausa" value="0" min="0" inputmode="numeric"></label>
        <label>Recargo festivo<div class="fi"><input type="text" id="j-fest-t" value="Día normal (sin recargo)" readonly><svg class="ic"><use href="#i-chev"/></svg></div></label>
        <input type="hidden" id="j-fest" value="none">
        <label>Cliente o buque (opcional)<input type="text" id="j-notas" placeholder="Ej. Empresa / Buque / Turno extra"></label>
        <button type="submit" class="btn full" id="btn-guardar">Guardar jornada</button>
        <button type="button" class="btn ghost full" id="btn-cancelar" hidden>Cancelar edición</button>
      </form>
    </div>
  </section>

  <section id="v-informes" class="screen">
    <div class="sheet">
      <div class="bar">
        <h3>Rendimiento</h3>
        <button type="button" class="chip" id="filtro-b"><span id="filtro-t">15 días</span><svg class="ic"><use href="#i-chev"/></svg></button><input type="hidden" id="filtro" value="15">
      </div>
      <div class="chart"><canvas id="grafica"></canvas></div>
    </div>
    <div class="sheet">
      <h3>Informe</h3>
      <div id="rep">
        <div class="rep-head"><b>Reporte de horas</b><br><small id="rep-perfil"></small></div>
        <div id="rep-por"></div>
        <div id="rep-pag"></div>
      </div>
      <button class="btn full" id="btn-pdf"><svg class="ic"><use href="#i-share"/></svg>Compartir PDF</button>
    </div>
  </section>

  <section id="v-perfil" class="screen">
    <div class="sheet">
      <h3>Datos laborales</h3>
      <form id="f-perfil" autocomplete="off">
        <label>Nombre o alias<input type="text" id="p-nombre" placeholder="Ej. Juan Pérez"></label>
        <label>Moneda<input type="text" id="p-moneda" placeholder="Ej. Q o $" maxlength="5"></label>
        <label>Tarifa por hora<input type="number" id="p-tarifa" step="0.01" min="0" inputmode="decimal" placeholder="Ej. 15.00"></label>
        <label>Recargo festivo (%)<input type="number" id="p-festivo" min="0" inputmode="numeric" placeholder="Ej. 100"></label>
        <button type="submit" class="btn full">Guardar perfil</button>
      </form>
    </div>
  </section>

</main>

<nav class="nav">
  <button data-v="inicio" class="active"><svg class="ic"><use href="#i-home"/></svg>Inicio</button>
  <button data-v="registro"><svg class="ic"><use href="#i-plus"/></svg>Registro</button>
  <button data-v="informes"><svg class="ic"><use href="#i-chart"/></svg>Informes</button>
  <button data-v="perfil"><svg class="ic"><use href="#i-user"/></svg>Perfil</button>
</nav>

<div id="m-fecha" class="modal">
  <div class="box cal">
    <div class="cal-head">
      <button type="button" class="hb" id="c-prev" aria-label="Mes anterior"><svg class="ic"><use href="#i-left"/></svg></button>
      <b id="c-titulo"></b>
      <button type="button" class="hb" id="c-next" aria-label="Mes siguiente"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
    <div class="dow"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
    <div class="grid" id="c-grid"></div>
    <div class="qa"><button type="button" class="btn ghost" id="c-hoy">Hoy</button><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" id="c-ok">Aceptar</button></div>
  </div>
</div>

<div id="m-hora" class="modal">
  <div class="box">
    <h3>Selecciona la hora</h3>
    <div class="wheel"><div class="band"></div><div class="col" id="w-h"></div><b>:</b><div class="col" id="w-m"></div></div>
    <div class="qa"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn" id="t-ok">Aceptar</button></div>
  </div>
</div>

<div id="m-borrar" class="modal">
  <div class="box">
    <h3 id="b-msg">¿Eliminar?</h3>
    <div class="qa"><button type="button" class="btn ghost" data-close>Cancelar</button><button type="button" class="btn danger" id="b-ok">Eliminar</button></div>
  </div>
</div>

<div id="m-menu" class="modal">
  <div class="box">
    <h3>Respaldos</h3>
    <button type="button" class="btn full" id="btn-export"><svg class="ic"><use href="#i-down"/></svg>Exportar respaldo (JSON)</button>
    <button type="button" class="btn ghost full" id="btn-import"><svg class="ic"><use href="#i-up"/></svg>Importar respaldo</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
    <button type="button" class="btn ghost full" data-close>Cerrar</button>
  </div>
</div>

<div id="m-pick" class="modal">
  <div class="box">
    <h3 id="pk-t"></h3>
    <div id="pk-l"></div>
    <button type="button" class="btn ghost full" data-close>Cancelar</button>
  </div>
</div>

<div id="toast"></div>

</body>
</html>
